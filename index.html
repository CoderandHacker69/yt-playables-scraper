<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Playables Scraped</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Inter', system-ui, sans-serif;
        background: #060b14;
        color: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, rgba(59, 130, 246, 0.18), transparent 28%),
          linear-gradient(180deg, #06111f 0%, #04070f 100%);
        color: #e2e8f0;
      }

      header {
        padding: 26px 34px;
        background: rgba(7, 13, 23, 0.96);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(12px);
      }

      header h1 {
        margin: 0 0 6px;
        font-size: clamp(2rem, 2.4vw, 3rem);
        letter-spacing: -0.04em;
      }

      header p {
        margin: 0;
        color: #94a3b8;
        max-width: 780px;
        line-height: 1.6;
      }

      .toolbar {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin: 20px 34px 12px;
      }

      .toolbar input,
      .toolbar button {
        min-width: 220px;
        border-radius: 14px;
        font-size: 0.98rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      .toolbar input {
        flex: 1;
        padding: 14px 16px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(15, 23, 42, 0.9);
        color: #e2e8f0;
      }

      .toolbar input::placeholder {
        color: #64748b;
      }

      .toolbar button {
        padding: 14px 18px;
        border: none;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        cursor: pointer;
      }

      .toolbar button:hover {
        transform: translateY(-1px);
        box-shadow: 0 18px 40px rgba(37, 99, 235, 0.22);
      }

      .status {
        margin: 0 34px 18px;
        color: #94a3b8;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 22px;
        padding: 0 34px 36px;
      }

      .card {
        background: rgba(10, 17, 31, 0.98);
        border: 1px solid rgba(148, 163, 184, 0.08);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 26px 60px rgba(6, 11, 20, 0.35);
        display: flex;
        flex-direction: column;
        min-height: 100%;
        backdrop-filter: blur(16px);
      }

      .card img {
        width: 100%;
        height: 240px;
        object-fit: contain;
        background: radial-gradient(circle at center, rgba(59, 130, 246, 0.08), transparent 45%);
        display: block;
        margin: 0 auto;
      }

      .card-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        text-align: center;
      }

      .card-title {
        font-size: 1.05rem;
        margin: 0;
        color: #f8fafc;
      }

      .card-links {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .card-links a {
        text-decoration: none;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 0.92rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
      }

      .link-btn {
        background: linear-gradient(135deg, #4f46e5, #2563eb);
        color: white;
      }

      .link-secondary {
        background: rgba(148, 163, 184, 0.14);
        color: #e2e8f0;
      }

      .card-links a:hover {
        transform: translateY(-1px);
      }

      .empty {
        margin: 24px 34px;
        font-size: 1rem;
        color: #94a3b8;
      }

      @media (max-width: 680px) {
        header {
          padding: 20px 18px;
        }

        .toolbar,
        .status,
        .grid {
          margin: 0;
          padding: 0 18px 28px;
        }

        .card img {
          height: 200px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>YouTube Playables</h1>
      <p>For Chill-Hub btw this took so long but bye-bye vortex lol</p>
    </header>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search by title..." />
      <button id="refresh">Reload</button>
    </div>
    <p class="status" id="status">Loading data...</p>
    <div class="grid" id="grid"></div>

    <script>
      const statusEl = document.getElementById('status');
      const gridEl = document.getElementById('grid');
      const searchEl = document.getElementById('search');
      const refreshEl = document.getElementById('refresh');
      let items = [];

      function renderCards(filtered) {
        gridEl.innerHTML = '';
        if (!filtered.length) {
          statusEl.textContent = 'Check your spelling gng 🥀';
          return;
        }
        statusEl.textContent = `Showing ${filtered.length} items.`;
        for (const item of filtered) {
          const card = document.createElement('article');
          card.className = 'card';

          const image = document.createElement('img');
          image.src = item.thumbnail_local || item.thumbnail_url || '';
          image.alt = item.title || 'Playable thumbnail';
          card.appendChild(image);

          const body = document.createElement('div');
          body.className = 'card-body';

          const title = document.createElement('h2');
          title.className = 'card-title';
          title.textContent = item.title || 'Untitled';
          body.appendChild(title);

          const links = document.createElement('div');
          links.className = 'card-links';

          const playable = document.createElement('a');
          playable.className = 'link-btn';
          playable.textContent = 'Regular (Blocked)';
          playable.href = item.regular_url || '#';
          playable.target = '_blank';
          links.appendChild(playable);

          if (item.cdn_asset_url) {
            const asset = document.createElement('a');
            asset.className = 'link-secondary';
            asset.textContent = 'Bypass (Unblocked)';
            asset.href = item.cdn_asset_url;
            asset.target = '_blank';
            links.appendChild(asset);
          }

          body.appendChild(links);
          card.appendChild(body);
          gridEl.appendChild(card);
        }
      }

      async function loadData() {
        statusEl.textContent = 'Loading data...';
        gridEl.innerHTML = '';
        try {
          const response = await fetch('youtube_playables_scraped.json');
          if (!response.ok) {
            throw new Error(`${response.status} ${response.statusText}`);
          }
          items = await response.json();
          renderCards(items);
        } catch (error) {
          statusEl.textContent = `Failed to load JSON file: ${error.message}`;
        }
      }

      function applySearch() {
        const query = searchEl.value.trim().toLowerCase();
        if (!query) {
          renderCards(items);
          return;
        }
        renderCards(items.filter(item => item.title.toLowerCase().includes(query)));
      }

      searchEl.addEventListener('input', applySearch);
      refreshEl.addEventListener('click', loadData);
      loadData();
    </script>
  </body>
</html>
